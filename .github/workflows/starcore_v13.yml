name: STARCORE Orchestrator v13 (AI-powered)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  starcore_v13:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout workspace
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai jq

    - name: Run STARCORE Orchestrator v13 (AI)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        WORKSPACE_ROOT="$GITHUB_WORKSPACE"
        MAP_FILE="$WORKSPACE_ROOT/workspace_map.json"
        AI_REPORT="$WORKSPACE_ROOT/starcore_ai_report.md"

        python << 'PY'
import os, json, subprocess, textwrap

workspace_root = os.environ["GITHUB_WORKSPACE"]
map_file = os.path.join(workspace_root, "workspace_map.json")
ai_report = os.path.join(workspace_root, "starcore_ai_report.md")

with open(map_file, "r", encoding="utf-8") as f:
    projects = json.load(f)

summary = []
for proj in projects:
    name = proj["Project"]
    path = os.path.join(workspace_root, proj["Path"])
    if not os.path.isdir(path):
        summary.append(f"- {name}: MISSING PATH ({proj['Path']})")
        continue
    # count files and size
    result = subprocess.run(
        ["bash", "-lc", f"find '{path}' -type f | wc -l"],
        capture_output=True, text=True
    )
    count = result.stdout.strip()
    result = subprocess.run(
        ["bash", "-lc", f"du -sm '{path}' | cut -f1"],
        capture_output=True, text=True
    )
    size = result.stdout.strip()
    summary.append(f"- {name}: {count} files, {size} MB, path={proj['Path']}")

report = [
    "# STARCORE Orchestrator v13 (AI-powered)",
    "",
    "## Workspace summary",
    "",
    *summary,
    "",
    "## AI analysis (high-level)",
    "",
    "> This section is generated by AI based on workspace_map.json and file statistics.",
    "",
]

# jednoduchý AI komentář – bez detailů, jen meta shrnutí
analysis_text = textwrap.dedent("""
Workspace contains multiple categorized projects (core, mobile, raspberry, infra, tools, archived).
Recommended next steps:
- Focus on core/starcore-platform as primary system hub.
- Ensure archived projects are either fully documented or excluded from future automation.
- Add build scripts (build.ps1 / build.sh) to key projects to enable CI builds.
- Gradually introduce tests and health checks per project to improve reliability.
""").strip()

report.append(analysis_text)

with open(ai_report, "w", encoding="utf-8") as f:
    f.write("\n".join(report))
PY

    - name: Commit AI report
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add starcore_ai_report.md
        git commit -m "STARCORE Orchestrator v13 AI report" || echo "No changes"
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fatalerorr69/STARCORE-WORKSPACE.git" HEAD:main
