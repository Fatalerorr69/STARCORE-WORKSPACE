name: STARCORE Orchestrator v13 (AI-powered)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrator_v13:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false   # FIX – zabrání smazání workspace

      - name: Install dependencies and verify
        run: |
          sudo apt update
          sudo apt install -y jq python3 python3-pip

          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq not installed" >&2
            exit 1
          fi

          if ! command -v python3 >/dev/null 2>&1; then
            echo "ERROR: python3 not installed" >&2
            exit 1
          fi

          jq --version
          python3 --version

      # (zbytek workflow ponechán beze změny)
