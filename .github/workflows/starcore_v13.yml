name: STARCORE Orchestrator v13 (AI-powered)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrator_v13:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Install dependencies and verify
        run: |
          sudo apt update
          sudo apt install -y jq python3 python3-pip

          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq not installed" >&2
            exit 1
          fi

          if ! command -v python3 >/dev/null 2>&1; then
            echo "ERROR: python3 not installed" >&2
            exit 1
          fi

          jq --version
          python3 --version

      - name: Detect case-sensitive path collisions
        run: |
          cd "${{ github.workspace }}"
          find . -type f -printf "%P\n" | awk '{print tolower($0)}' | sort | uniq -d > .case_collisions.txt || true

          if [ -s .case_collisions.txt ]; then
            echo "Case-sensitive path collisions detected:" > case_collisions_report.txt
            cat .case_collisions.txt >> case_collisions_report.txt
          else
            echo "No case collisions detected" > case_collisions_report.txt
          fi

          cat case_collisions_report.txt

      - name: Pre-create all required output files
        run: |
          cd "${{ github.workspace }}"
          touch dashboard.html \
                dependency_graph.json \
                starcore_orchestrator_log.txt \
                starcore_analyzer_log.txt \
                starcore_ai_report.md \
                case_collisions_report.txt

      - name: Generate dashboard.html
        run: |
          cd "${{ github.workspace }}"
          MAP="workspace_map.json"
          OUT="dashboard.html"

          if [ ! -f "$MAP" ]; then
            echo "<html><body><h1>STARCORE Dashboard</h1><p>workspace_map.json missing</p></body></html>" > "$OUT"
            exit 0
          fi

          if ! jq empty "$MAP" >/dev/null 2>&1; then
            echo "<html><body><h1>STARCORE Dashboard</h1><p>workspace_map.json invalid</p></body></html>" > "$OUT"
            exit 0
          fi

          echo "<html><body><h1>STARCORE Dashboard v13</h1><table border=1>" > "$OUT"
          echo "<tr><th>Project</th><th>Category</th><th>GitHub</th><th>Path</th><th>Status</th></tr>" >> "$OUT"

          jq -c '.[]' "$MAP" | while read -r line; do
            NAME=$(echo "$line" | jq -r '.Project')
            CAT=$(echo "$line"  | jq -r '.Category')
            GIT=$(echo "$line"  | jq -r '.GitHub')
            PATH=$(echo "$line" | jq -r '.Path')
            FULL="${{ github.workspace }}/$PATH"

            if [ -d "$FULL" ]; then STATUS="OK"; else STATUS="MISSING"; fi

            echo "<tr><td>$NAME</td><td>$CAT</td><td><a href=\"$GIT\">$GIT</a></td><td>$PATH</td><td>$STATUS</td></tr>" >> "$OUT"
          done

          echo "</table></body></html>" >> "$OUT"

      - name: Generate dependency_graph.json
        run: |
          python3 - << 'PY'
          import os, json, re

          root = os.environ.get("GITHUB_WORKSPACE", ".")
          map_path = os.path.join(root, "workspace_map.json")
          out = os.path.join(root, "dependency_graph.json")

          if not os.path.isfile(map_path):
              with open(out, "w", encoding="utf-8") as f:
                  f.write("[]")
              raise SystemExit(0)

          with open(map_path, "r", encoding="utf-8") as f:
              projects = json.load(f)

          graph = []
          imp_re = re.compile(r'Import-Module\s+(.+)', re.IGNORECASE)

          for proj in projects:
              name = proj.get("Project", "")
              path = proj.get("Path", "")
              full = os.path.join(root, path)

              if not os.path.isdir(full):
                  continue

              for dirpath, _, files in os.walk(full):
                  for fn in files:
                      if fn.lower().endswith(".ps1"):
                          p = os.path.join(dirpath, fn)
                          try:
                              with open(p, "r", encoding="utf-8", errors="ignore") as sf:
                                  for line in sf:
                                      m = imp_re.search(line)
                                      if m:
                                          module = m.group(1).strip().strip('"').strip("'")
                                          graph.append({
                                              "Project": name,
                                              "Script": os.path.relpath(p, root),
                                              "Module": module
                                          })
                          except Exception:
                              pass

          with open(out, "w", encoding="utf-8") as f:
              json.dump(graph, f, indent=2)
          PY


      - name: Generate starcore_orchestrator_log.txt
        run: |
          cd "${{ github.workspace }}"
          MAP="workspace_map.json"
          LOG="starcore_orchestrator_log.txt"

          echo "=== STARCORE ORCHESTRATOR v13 LOG ===" > "$LOG"

          if [ ! -f "$MAP" ]; then
            echo "workspace_map.json missing" >> "$LOG"
            exit 0
          fi

          jq -c '.[]' "$MAP" | while read -r line; do
            NAME=$(echo "$line" | jq -r '.Project')
            PATH=$(echo "$line" | jq -r '.Path')
            FULL="${{ github.workspace }}/$PATH"

            if [ -d "$FULL" ]; then
              COUNT=$(find "$FULL" -type f | wc -l)
              SIZE=$(du -sh "$FULL" | awk '{print $1}')
              echo "$NAME → $COUNT files, $SIZE, path=$PATH" >> "$LOG"
            else
              echo "$NAME → MISSING PATH ($PATH)" >> "$LOG"
            fi
          done

      - name: Generate starcore_analyzer_log.txt
        run: |
          cd "${{ github.workspace }}"
          MAP="workspace_map.json"
          LOG="starcore_analyzer_log.txt"

          echo "=== WORKSPACE ANALYZER v13 LOG ===" > "$LOG"

          if [ ! -f "$MAP" ]; then
            echo "workspace_map.json missing" >> "$LOG"
            exit 0
          fi

          jq -c '.[]' "$MAP" | while read -r line; do
            NAME=$(echo "$line" | jq -r '.Project')
            PATH=$(echo "$line" | jq -r '.Path')
            FULL="${{ github.workspace }}/$PATH"

            if [ -d "$FULL" ]; then
              FILES=$(find "$FULL" -type f | wc -l)
              PS1=$(find "$FULL" -type f -name "*.ps1" | wc -l)
              MD=$(find "$FULL" -type f -name "*.md" | wc -l)
              echo "$NAME → files=$FILES, ps1=$PS1, md=$MD, path=$PATH" >> "$LOG"
            else
              echo "$NAME → MISSING PATH ($PATH)" >> "$LOG"
            fi
          done

      - name: Generate starcore_ai_report.md
        run: |
          cd "${{ github.workspace }}"
          MAP="workspace_map.json"
          OUT="starcore_ai_report.md"

          echo "# STARCORE AI Report v13" > "$OUT"
          echo "" >> "$OUT"
          echo "## Workspace overview" >> "$OUT"

          if [ ! -f "$MAP" ]; then
            echo "- workspace_map.json missing" >> "$OUT"
            exit 0
          fi

          jq -c '.[]' "$MAP" | while read -r line; do
            NAME=$(echo "$line" | jq -r '.Project')
            CAT=$(echo "$line" | jq -r '.Category')
            GIT=$(echo "$line" | jq -r '.GitHub')
            PATH=$(echo "$line" | jq -r '.Path')
            FULL="${{ github.workspace }}/$PATH"

            if [ -d "$FULL" ]; then
              FILES=$(find "$FULL" -type f | wc -l)
              echo "- **$NAME** ($CAT) → $FILES files, path=$PATH, GitHub=$GIT" >> "$OUT"
            else
              echo "- **$NAME** ($CAT) → MISSING PATH ($PATH), GitHub=$GIT" >> "$OUT"
            fi
          done

          echo "" >> "$OUT"
          echo "## AI recommendations" >> "$OUT"
          echo "- Normalize workspace_map.json" >> "$OUT"
          echo "- Add tests to core projects" >> "$OUT"
          echo "- Use STARCORE v14 Auto-Fixer" >> "$OUT"

      - name: Commit and push v13 outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ github.workspace }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add dashboard.html \
                  dependency_graph.json \
                  starcore_orchestrator_log.txt \
                  starcore_analyzer_log.txt \
                  starcore_ai_report.md \
                  case_collisions_report.txt || true

          git commit -m "STARCORE v13 outputs generated" || echo "No changes"

          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
