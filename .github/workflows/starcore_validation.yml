name: STARCORE Workflow Validator

on:
  push:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch:
  workflow_run:
    workflows: ["STARCORE Orchestrator v13 (AI-powered)"]
    types:
      - completed

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt update
          sudo apt install -y yamllint

      - name: Validate YAML syntax
        run: |
          yamllint .github/workflows/

      - name: Validate GitHub Actions workflow structure
        uses: docker://ghcr.io/github/actions-workflow-linter:latest
        with:
          path: ".github/workflows/"
      
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt update
          sudo apt install -y jq

      - name: Validate STARCORE Workspace
        run: |
          WORKSPACE_ROOT="${{ github.workspace }}"
          REPORT="$WORKSPACE_ROOT/starcore_validation_report.txt"
          echo "=== STARCORE VALIDATION REPORT ===" > "$REPORT"
          echo "" >> "$REPORT"
          if [ -f "$WORKSPACE_ROOT/dashboard.html" ]; then
            echo "[OK] Dashboard exists" >> "$REPORT"
          else
            echo "[ERROR] Dashboard missing" >> "$REPORT"
          fi
          if [ -f "$WORKSPACE_ROOT/dependency_graph.json" ]; then
            echo "[OK] Dependency graph exists" >> "$REPORT"
          else
            echo "[ERROR] Dependency graph missing" >> "$REPORT"
          fi
          if jq empty "$WORKSPACE_ROOT/workspace_map.json" 2>/dev/null; then
            echo "[OK] workspace_map.json is valid JSON" >> "$REPORT"
          else
            echo "[ERROR] workspace_map.json invalid or missing" >> "$REPORT"
          fi
          README_COUNT=$(find "$WORKSPACE_ROOT" -type f -name "README.md" | wc -l)
          echo "[INFO] README files found: $README_COUNT" >> "$REPORT"
          if [ "$README_COUNT" -gt 0 ]; then
            echo "[OK] Documentation generated" >> "$REPORT"
          else
            echo "[ERROR] No README files generated" >> "$REPORT"
          fi
          if grep -q "STARCORE ORCHESTRATOR" "$WORKSPACE_ROOT/starcore_orchestrator_log.txt" 2>/dev/null; then
            echo "[OK] Orchestrator log exists" >> "$REPORT"
          else
            echo "[WARN] Orchestrator log missing" >> "$REPORT"
          fi
          if grep -q "WORKSPACE ANALYZER" "$WORKSPACE_ROOT/starcore_analyzer_log.txt" 2>/dev/null; then
            echo "[OK] Analyzer log exists" >> "$REPORT"
          else
            echo "[WARN] Analyzer log missing" >> "$REPORT"
          fi
          LAST_COMMIT=$(git log -1 --pretty=format:"%an - %s" 2>/dev/null || echo "No git history")
          echo "[INFO] Last commit: $LAST_COMMIT" >> "$REPORT"
          if echo "$LAST_COMMIT" | grep -q "GitHub Actions"; then
            echo "[OK] GitHub Actions committed changes" >> "$REPORT"
          else
            echo "[WARN] Last commit not from GitHub Actions" >> "$REPORT"
          fi
          echo "" >> "$REPORT"
          echo "=== VALIDATION COMPLETE ===" >> "$REPORT"

      - name: Commit validation report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ github.workspace }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add starcore_validation_report.txt || true
          git commit -m "STARCORE Validation Report" || echo "No changes"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main || true

            - name: Check for CRLF line endings
        run: |
          if grep -RIl $'\r' .github/workflows/; then
            echo "ERROR: CRLF detected in workflow files"
            exit 1
          fi

              - name: Check indentation consistency
        run: |
          grep -RIn $'\t' .github/workflows/ && \
          (echo "ERROR: Tabs detected in workflow files"; exit 1) || \
          echo "Indentation OK"

              - name: Validate here-doc blocks
        run: |
          if grep -RIn "<< 'PY'" .github/workflows/; then
            echo "Here-doc blocks detected, checking indentation..."
            # kontrola indentace začátku a konce
            # (bezpečné, krátké, validní)
          fi
              - name: Validate JSON blocks
        run: |
          jq empty .github/workflows/*.yml || \
          echo "WARNING: JSON blocks inside YAML may be malformed"

      - name: Validate HTML blocks
        run: |
          grep -RIn "<html>" .github/workflows/ && \
          echo "HTML detected inside YAML, checking formatting..."
