name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (black + flake8)
        run: |
          pip install black flake8
          black --check .
          flake8 src || true
      - name: Run basic import test
        run: |
          python -c "import sys; sys.path.append('src'); import analyzer; print('imports ok')"
      - name: Build docker-compose (validate)
        run: docker-compose -f docker-compose.yml config --resolve-image-digests
