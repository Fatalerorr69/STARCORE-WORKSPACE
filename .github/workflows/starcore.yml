name: STARCORE Master Orchestrator

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  starcore:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout workspace
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y jq

    - name: Run STARCORE Master Script
      run: |
        WORKSPACE_ROOT="$GITHUB_WORKSPACE"
        MAP_FILE="$WORKSPACE_ROOT/workspace_map.json"

        echo "=== STARCORE MASTER START ==="

        # 1) EXISTING PROJECTS
        jq -r '.[].Path' "$MAP_FILE" | while read path; do
            if [ -d "$WORKSPACE_ROOT/$path" ]; then
                basename "$path"
            fi
        done > "$WORKSPACE_ROOT/workspace_existing.txt"

        # 2) REMOVE EMPTY DIRECTORIES
        find "$WORKSPACE_ROOT" -type d -empty -print -delete

        # 3) REGENERATE MAP
        FINAL="$WORKSPACE_ROOT/workspace_final.txt"
        find "$WORKSPACE_ROOT" -type d | grep -E "/core/|/mobile/|/raspberry/|/infra/|/tools/|/archived/" | awk -F/ '{print $NF}' | sort -u > "$FINAL"

        rm "$MAP_FILE"
        echo "[" > "$MAP_FILE"
        first=true

        while read proj; do
            dir=$(find "$WORKSPACE_ROOT" -type d -name "$proj" | head -n 1)
            category=$(basename "$(dirname "$dir")")
            path="$category/$proj"

            if [ "$first" = true ]; then
                first=false
            else
                echo "," >> "$MAP_FILE"
            fi

            echo "{\"Project\":\"$proj\",\"Category\":\"$category\",\"GitHub\":\"https://github.com/Fatalerorr69/$proj\",\"Path\":\"$path\"}" >> "$MAP_FILE"
        done < "$FINAL"

        echo "]" >> "$MAP_FILE"

        # 4) ORCHESTRATOR
        jq -c '.[]' "$MAP_FILE" | while read proj; do
            name=$(echo "$proj" | jq -r '.Project')
            path=$(echo "$proj" | jq -r '.Path')
            full="$WORKSPACE_ROOT/$path"

            if [ ! -d "$full" ]; then
                echo "!!! $name neexistuje – přeskočeno."
                continue
            fi

            count=$(find "$full" -type f | wc -l)
            size=$(du -sm "$full" | cut -f1)

            echo ">>> $name"
            echo "  Soubory: $count"
            echo "  Velikost: ${size}MB"
        done

        # 5) DASHBOARD
        DASH="$WORKSPACE_ROOT/dashboard.html"
        echo "<html><body><h1>STARCORE Dashboard</h1><table border=1>" > "$DASH"

        jq -c '.[]' "$MAP_FILE" | while read proj; do
            name=$(echo "$proj" | jq -r '.Project')
            cat=$(echo "$proj" | jq -r '.Category')
            gh=$(echo "$proj" | jq -r '.GitHub')
            path=$(echo "$proj" | jq -r '.Path')

            echo "<tr><td>$name</td><td>$cat</td><td><a href='$gh'>Repo</a></td><td>$path</td></tr>" >> "$DASH"
        done

        echo "</table></body></html>" >> "$DASH"

        # 6) DOCUMENTATION
        jq -c '.[]' "$MAP_FILE" | while read proj; do
            name=$(echo "$proj" | jq -r '.Project')
            path=$(echo "$proj" | jq -r '.Path')
            full="$WORKSPACE_ROOT/$path"

            if [ ! -d "$full" ]; then
                continue
            fi

            readme="$full/README.md"

            echo "# $name" > "$readme"
            echo "Kategorie: **$(echo "$proj" | jq -r '.Category')**" >> "$readme"
            echo "GitHub: $(echo "$proj" | jq -r '.GitHub')" >> "$readme"
            echo "" >> "$readme"
            echo "## Struktura projektu" >> "$readme"

            find "$full" -type f | sed "s|$WORKSPACE_ROOT||" >> "$readme"
        done

        # 7) DEPENDENCY GRAPH
        GRAPH="$WORKSPACE_ROOT/dependency_graph.json"
        echo "[" > "$GRAPH"
        first=true

        jq -c '.[]' "$MAP_FILE" | while read proj; do
            name=$(echo "$proj" | jq -r '.Project')
            path=$(echo "$proj" | jq -r '.Path')
            full="$WORKSPACE_ROOT/$path"

            find "$full" -type f -name "*.ps1" | while read file; do
                module=$(grep -oP 'Import-Module\s+\K\S+' "$file")

                if [ ! -z "$module" ]; then
                    if [ "$first" = true ]; then
                        first=false
                    else
                        echo "," >> "$GRAPH"
                    fi

                    echo "{\"Project\":\"$name\",\"Module\":\"$module\"}" >> "$GRAPH"
                fi
            done
        done

        echo "]" >> "$GRAPH"

    - name: Commit results
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "STARCORE Master Orchestrator Update" || echo "No changes"
        git push