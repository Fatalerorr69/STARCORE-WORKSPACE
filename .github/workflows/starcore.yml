name: STARCORE Master Orchestrator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  starcore_master:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout workspace
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y jq

    - name: Run STARCORE Master Script
      run: |
        WORKSPACE_ROOT="$GITHUB_WORKSPACE"
        MAP_FILE="$WORKSPACE_ROOT/workspace_map.json"

        # EXISTING PROJECTS
        jq -r '.[].Path' "$MAP_FILE" | while read path; do
          if [ -d "$WORKSPACE_ROOT/$path" ]; then
            basename "$path"
          fi
        done > "$WORKSPACE_ROOT/workspace_existing.txt"

        # REMOVE EMPTY DIRECTORIES
        find "$WORKSPACE_ROOT" -type d -empty -print -delete

        # REGENERATE MAP (jen projekty, které existují)
        FINAL="$WORKSPACE_ROOT/workspace_final.txt"
        find "$WORKSPACE_ROOT" -type d | grep -E "/core/|/mobile/|/raspberry/|/infra/|/tools/|/archived/" | awk -F/ '{print $NF}' | sort -u > "$FINAL"

        rm "$MAP_FILE"
        echo "[" > "$MAP_FILE"
        first=true

        while read proj; do
          dir=$(find "$WORKSPACE_ROOT" -type d -name "$proj" | head -n 1)
          category=$(basename "$(dirname "$dir")")
          path="$category/$proj"

          if [ "$first" = true ]; then
            first=false
          else
            echo "," >> "$MAP_FILE"
          fi

          echo "{\"Project\":\"$proj\",\"Category\":\"$category\",\"GitHub\":\"https://github.com/Fatalerorr69/$proj\",\"Path\":\"$path\"}" >> "$MAP_FILE"
        done < "$FINAL"

        echo "]" >> "$MAP_FILE"

        # GENERATE README FOR EACH PROJECT
        jq -c '.[]' "$MAP_FILE" | while read proj; do
          name=$(echo "$proj" | jq -r '.Project')
          path=$(echo "$proj" | jq -r '.Path')
          full="$WORKSPACE_ROOT/$path"

          if [ ! -d "$full" ]; then
            continue
          fi

          readme="$full/README.md"

          echo "# $name" > "$readme"
          echo "Kategorie: **$(echo "$proj" | jq -r '.Category')**" >> "$readme"
          echo "GitHub: $(echo "$proj" | jq -r '.GitHub')" >> "$readme"
          echo "" >> "$readme"
          echo "## Struktura projektu" >> "$readme"

          find "$full" -type f | sed "s|$WORKSPACE_ROOT||" >> "$readme"
        done

    - name: Commit Master results
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add workspace_map.json workspace_existing.txt
        git commit -m "STARCORE Master Orchestrator update" || echo "No changes"
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Fatalerorr69/STARCORE-WORKSPACE.git" HEAD:main
